services:
  database:
    image: mariadb:11.4.5@sha256:49117dcc565cf51aa57ac5fca59ab31213402ff0eae6ffc13c46a37b938f7e4b
    environment:
      MARIADB_DATABASE: ${WP_DB_NAME:?required}
      MARIADB_USER: ${WP_DB_USER:?required}
      MARIADB_PASSWORD: ${WP_DB_PASSWORD:?required}
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD:?required}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - database-data:/var/lib/mysql

  wordpress:
    image: wordpress:7.1.3-php8.3-apache@sha256:8ecd8d8e374167ea22235acf30f80d1165b82f07ffa5bcef90c1cad8f7be251f
    depends_on:
      database:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME:?required}
      WORDPRESS_DB_USER: ${WP_DB_USER:?required}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:?required}
      JWT_BRIDGE_TEST_SECRET: ${JWT_BRIDGE_TEST_SECRET:?required}
      JWT_BRIDGE_TEST_JWT_KEY: ${JWT_BRIDGE_TEST_JWT_KEY:?required}
      JWT_BRIDGE_TEST_JWT_ALGORITHM: ${JWT_BRIDGE_TEST_JWT_ALGORITHM:?required}
      JWT_BRIDGE_TEST_JWT_ISSUER: ${JWT_BRIDGE_TEST_JWT_ISSUER:?required}
      JWT_BRIDGE_TEST_VALIDATOR_MODE: ${JWT_BRIDGE_TEST_VALIDATOR_MODE:-reference}
      JWT_LOGIN_ACTIVE_VALIDATOR: ${JWT_LOGIN_ACTIVE_VALIDATOR-}
      JWT_LOGIN_COOKIE_DOMAIN: ${JWT_LOGIN_COOKIE_DOMAIN-}
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
        define('FORCE_SSL_ADMIN', true);
        define('JWT_LOGIN_COOKIE_DOMAIN', (string) getenv('JWT_LOGIN_COOKIE_DOMAIN'));
        if (getenv('JWT_LOGIN_ACTIVE_VALIDATOR') !== false && getenv('JWT_LOGIN_ACTIVE_VALIDATOR') !== '') {
            define('JWT_LOGIN_ACTIVE_VALIDATOR', (string) getenv('JWT_LOGIN_ACTIVE_VALIDATOR'));
        }
    volumes:
      - wordpress-data:/var/www/html
      - ../..:/workspace:ro
      - ${INTEGRATION_RUNTIME_DIR:?required}:/integration-runtime:ro

  proxy:
    image: nginx:1.27.4-alpine@sha256:4ff102c5d78d254a6f0da062b3cf39eaf07f01eec0927fd21e219d0af8bc0591
    depends_on:
      - wordpress
    ports:
      - "127.0.0.1:${HTTPS_PORT:?required}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_FILE:?required}:/etc/nginx/tls/cert.pem:ro
      - ${TLS_KEY_FILE:?required}:/etc/nginx/tls/key.pem:ro

  cli:
    image: wordpress:cli-2.12.0-php8.3@sha256:36243da432a0f0a3b56dc3240ecee9b159108d71305e7c064d987a20a465bfde
    depends_on:
      database:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME:?required}
      WORDPRESS_DB_USER: ${WP_DB_USER:?required}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:?required}
    user: "33:33"
    working_dir: /var/www/html
    volumes:
      - wordpress-data:/var/www/html
      - ${INTEGRATION_RUNTIME_DIR:?required}:/integration-runtime:ro

volumes:
  database-data:
  wordpress-data:
